apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: barista
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  clusterIP: None ## For StatefulSet

---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: barista
spec:
  selector:
    app: flask
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: barista
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
  
